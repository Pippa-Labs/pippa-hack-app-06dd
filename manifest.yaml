# ─────────────────────────────────────────────────────────────────────────────
# Dry Spell: when the rain stops at a place you name, and how long it stays dry.
#
# This file IS the app's contract. Pippa builds the install screen from it, and
# the runtime refuses any output field that is not declared here.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Every hackathon app keeps nothing between calls. Not changeable.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# The name everybody sees next to the app: "by <name>" on the install screen,
# in the list of apps and on every answer. PUBLIC, and readable here on GitHub
# too. It does not decide who owns the app, and nothing in this file does:
# Pippa Labs created this repository for one Pippa account, so every app
# published from it is that account's. docs/REVIEW_AND_SHARING.md has the rest.
app_author_name: "AdrianPersonal"

app:
  # `hack.` + the repository name without `pippa-hack-`, hyphens to underscores.
  id: hack.app_06dd
  name: Dry Spell
  # Draft versions can be pushed again under the same number. Once a version
  # is submitted for review it is frozen: bump this before the next push.
  version: 0.1.0
  # Never the word "by": the badge is parsed from "[via <name> <version> by
  # <author name>]" and splits at the first one.
  summary: >-
    Finds when the rain stops and the next dry spell begins at a town or city
    you name, and how long it stays dry. The place name is sent to Open-Meteo
    to find it and fetch its hourly forecast.

agent_types:
  - personal

outcomes:
  - id: dry.window
    summary: >-
      When the rain stops and the next dry spell starts at a place, and how
      long it stays dry, for walking the dog, a run or drying the washing
    # Only about the first four reach Pippa's first decision, so they carry
    # both halves of the summary: "when does the rain stop" and "a dry spell
    # long enough for something".
    example_phrases:
      - when will it stop raining
      - when is the next dry spell
      - when can i hang the washing out
      - will it stay dry for a couple of hours
      - how long until the rain stops in leeds
      - is it dry enough to walk the dog
      - next dry window for a bike ride
      - when can i go out without getting wet
    inputs:
      - name: place
        type: string
        required: false
        description: >-
          The town, city or village the user asked about, as they wrote it
          (for example "Leeds" or "Milton Keynes"), without any country or
          region. Return an empty string if the message names no place. Never
          guess a place, and never use one that was not in the message.
      - name: region
        type: string
        required: false
        description: >-
          The country, state or region the user gave with the place, if they
          gave one (for example "Virginia" for "Bristol, Virginia", or
          "France"). Return an empty string if they gave none. Never fill this
          in from your own knowledge of where the place is.
      - name: hours_needed
        type: number
        required: false
        description: >-
          How many hours of dry weather the user needs, if they said (a two
          hour walk is 2, ninety minutes is 1.5, "a couple of hours" is 2).
          Leave this out entirely if they did not say how long. Never guess a
          typical length for the activity.
    output:
      - name: place_used
        type: string
        description: >-
          The place whose forecast was used, with its region and country, such
          as "Bristol, England, United Kingdom", so the answer can say which
          one was meant.
      - name: timezone_used
        type: string
        description: The time zone the times are given in, such as "Europe/London".
      - name: found
        type: boolean
        description: >-
          True when a dry spell at least as long as the one asked for was
          found in the forecast.
      - name: dry_now
        type: boolean
        description: True when it is dry now and stays dry for at least the hours asked for.
      - name: start
        type: string
        required: false
        description: >-
          When the dry spell begins, as the place's local clock time with the
          weekday, for example "Friday 14:00". The current time when it is
          dry now. Absent when none was found.
      - name: end
        type: string
        required: false
        description: >-
          When rain is next likely after that start, in the same form. If the
          spell lasts past the end of the forecast, the end of the forecast.
          Absent when none was found.
      - name: hours_found
        type: number
        description: How many hours the dry spell lasts, to one decimal place. 0 when none was found.
      - name: dry_beyond_forecast
        type: boolean
        description: >-
          True when the dry spell is still going at the end of the forecast,
          so it may last longer than hours_found.
      - name: max_rain_chance_percent
        type: integer
        required: false
        description: The highest hourly chance of rain during the dry spell. Absent when none was found.
      - name: max_temp_c
        type: number
        required: false
        description: The warmest hourly temperature during the dry spell, in Celsius.
      - name: min_temp_c
        type: number
        required: false
        description: The coldest hourly temperature during the dry spell, in Celsius.
      - name: max_wind_kph
        type: number
        required: false
        description: The strongest hourly wind speed during the dry spell, in kilometres per hour.
      - name: least_wet_start
        type: string
        required: false
        description: >-
          Only when no dry spell was found: when the stretch of the length
          asked for with the lowest chance of rain begins, in the same form
          as start.
      - name: least_wet_rain_chance_percent
        type: integer
        required: false
        description: >-
          Only when no dry spell was found: the highest hourly chance of rain
          in that least wet stretch.
      - name: hours_needed
        type: number
        description: The length of dry spell that was looked for. 1 when the user did not say.
      - name: threshold_percent
        type: integer
        description: >-
          The rule for "dry": every hour has this chance of rain or less, and
          no rain is forecast in it.
      - name: hours_searched
        type: integer
        description: How many hours of forecast, from now, were searched.
